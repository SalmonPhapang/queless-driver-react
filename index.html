<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#06C167" />
    <meta
      name="description"
      content="Queless Driver — accept deliveries, track your route and get paid."
    />
    <title>Queless Driver</title>
    <script>
      // Apply the saved/system theme before first paint (no flash of light UI).
      try {
        var mode = localStorage.getItem('theme_mode');
        var dark =
          mode === 'dark' ||
          ((!mode || mode === 'system') &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (error) {
        /* localStorage can be unavailable; CSS defaults to light. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
